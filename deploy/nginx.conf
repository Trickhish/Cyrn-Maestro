# Reverse proxy for maestro.cyrn.fr → 127.0.0.1:3000
#
#   cp deploy/nginx.conf /etc/nginx/sites-available/maestro.cyrn.fr
#   ln -s /etc/nginx/sites-available/maestro.cyrn.fr /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# For TLS, run certbot --nginx -d maestro.cyrn.fr after this is in place; it
# rewrites the server block and adds the :443 listener itself.

# Maps a missing Upgrade header to "close" rather than an empty value, which
# some clients reject. Valid here because sites-enabled files are included
# inside http{}. If your nginx.conf already defines this map, delete these four
# lines — a duplicate map name is a config error.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name maestro.cyrn.fr;

    access_log /var/log/nginx/maestro.access.log;
    error_log  /var/log/nginx/maestro.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Already in place for when the node socket and the UI event stream
        # land at /ws — without these an upgrade request is silently downgraded
        # to a plain request and the socket dies on connect.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived streams must not be cut at nginx's 60s default.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Server-sent events and streaming responses need buffering off, or
        # nginx holds the chunks until the response completes.
        proxy_buffering off;
    }
}
